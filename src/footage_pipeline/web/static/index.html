<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Footage Pipeline — Backup</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Footage Pipeline</h1>
    <span class="stage">Backup</span>
  </header>

  <main>
    <section class="card">
      <h2>Destination</h2>
      <p class="hint">Where backups are mirrored. Set once, remembered between runs.</p>
      <div class="row">
        <code id="backup-root" class="path">not set</code>
        <button id="pick-root" class="btn ghost">Change…</button>
      </div>
      <p id="root-warning" class="warn hidden"></p>
    </section>

    <section class="card">
      <h2>Source</h2>
      <p class="hint">Chosen fresh each run. The last folder you used is pre-filled.</p>
      <div class="row">
        <input id="source" type="text" spellcheck="false" placeholder="/Volumes/CARD_01">
        <button id="pick-source" class="btn ghost">Choose…</button>
      </div>
      <div class="row">
        <button id="start" class="btn primary">Start backup</button>
        <button id="preflight" class="btn ghost">Check size first</button>
      </div>
      <p id="preflight-out" class="hint"></p>
    </section>

    <section id="progress-card" class="card hidden">
      <h2>Progress</h2>
      <div class="bar"><div id="bar-fill"></div></div>
      <p class="mono" id="progress-line">—</p>
      <p class="mono muted" id="current-file">—</p>
    </section>

    <section id="report-card" class="card hidden">
      <h2>Report</h2>
      <p id="outcome" class="outcome">—</p>
      <div class="counts">
        <div><span id="c-copied" class="n">0</span><label>copied</label></div>
        <div><span id="c-skipped" class="n">0</span><label>skipped</label></div>
        <div><span id="c-conflicts" class="n">0</span><label>conflicts</label></div>
        <div><span id="c-failed" class="n">0</span><label>failures</label></div>
      </div>
      <p class="hint">Manifest</p>
      <code id="manifest-path" class="path"></code>
      <div id="detail"></div>
    </section>

    <p id="error" class="error hidden"></p>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
